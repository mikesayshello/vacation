<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacation Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: header band, then a grid of numbered picture cards, one per diary entry. */
:root {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --ink: #23303a;
  --muted: #5d6b75;
  --accent: #e07b2d;
  --line: #ddd6c8;
  --display: "Fredoka", "Trebuchet MS", sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161b1f; --surface: #20272d; --ink: #edf1f3; --muted: #a2b0b9; --line: #34404a; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #161b1f; --surface: #20272d; --ink: #edf1f3; --muted: #a2b0b9; --line: #34404a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
header { padding: 36px 0 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 8vw, 56px); margin: 0; line-height: 1.05; text-wrap: balance; }
.sub { color: var(--muted); margin: 10px 0 0; max-width: 54ch; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 12px 0 48px; }
.card { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card svg { display: block; width: 100%; height: auto; }
.card figcaption { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px 14px; border-top: 3px solid var(--accent); }
.num { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.cap { font-weight: 600; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>

  <div class="wrap">
